{% for link in site.author.links %}
  <li>
    <a href="{{ link.url }}" rel="nofollow noopener noreferrer me" itemprop="sameAs">
      {% if link.image %}
        <img src="{{ link.image }}" alt="{{ link.label }}" style="width: 30px; height: auto; vertical-align: middle;">
      {% elsif link.icon %}
        <i class="{{ link.icon }}" aria-hidden="true"></i>
      {% endif %}
      <span class="label">{{ link.label }}</span>
    </a>
  </li>
{% endfor %}
