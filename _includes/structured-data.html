<!-- JSON-LD Structured Data -->
{% if page.url == "/" or page.url == "/index.html" %}
<!-- Homepage: Organization + WebSite -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "{{ site.url }}{{ site.baseurl }}/#organization",
      "name": "{{ site.title }}",
      "url": "{{ site.url }}{{ site.baseurl }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ site.url }}{{ site.logo }}",
        "width": "512",
        "height": "512"
      },
      "sameAs": [
        "{{ site.logo_url }}"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "{{ site.email }}",
        "contactType": "Customer Service"
      }
    },
    {
      "@type": "WebSite",
      "@id": "{{ site.url }}{{ site.baseurl }}/#website",
      "url": "{{ site.url }}{{ site.baseurl }}",
      "name": "{{ site.title }}",
      "description": "{{ site.description | strip_newlines | escape }}",
      "publisher": {
        "@id": "{{ site.url }}{{ site.baseurl }}/#organization"
      },
      "inLanguage": "en-US"
    },
    {
      "@type": "Person",
      "@id": "{{ site.url }}{{ site.baseurl }}/#author",
      "name": "{{ site.author.name }}",
      "url": "{{ site.url }}{{ site.baseurl }}",
      "image": {
        "@type": "ImageObject",
        "url": "{{ site.url }}{{ site.author.avatar }}",
        "caption": "{{ site.author.name }}"
      },
      "sameAs": [
        "https://linkedin.com/in/dancvrcek",
        "{{ site.logo_url }}"
      ],
      "jobTitle": "Infrastructure Intelligence Consultant",
      "worksFor": {
        "@id": "{{ site.url }}{{ site.baseurl }}/#organization"
      }
    }
  ]
}
</script>
{% elsif page.layout == "single" and page.categories %}
<!-- Blog Post: BlogPosting + BreadcrumbList -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "BlogPosting",
      "@id": "{{ site.url }}{{ site.baseurl }}{{ page.url }}#article",
      "headline": "{{ page.title | escape }}",
      "description": "{{ page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}",
      "datePublished": "{{ page.date | date_to_xmlschema }}",
      "dateModified": "{% if page.last_modified_at %}{{ page.last_modified_at | date_to_xmlschema }}{% else %}{{ page.date | date_to_xmlschema }}{% endif }}",
      "author": {
        "@type": "Person",
        "@id": "{{ site.url }}{{ site.baseurl }}/#author",
        "name": "{{ site.author.name }}",
        "url": "{{ site.url }}{{ site.baseurl }}"
      },
      "publisher": {
        "@type": "Organization",
        "@id": "{{ site.url }}{{ site.baseurl }}/#organization",
        "name": "{{ site.title }}",
        "logo": {
          "@type": "ImageObject",
          "url": "{{ site.url }}{{ site.logo }}"
        }
      },
      "image": {
        "@type": "ImageObject",
        "url": "{% if page.header.image %}{{ site.url }}{{ page.header.image }}{% elsif page.header.teaser %}{{ site.url }}{{ page.header.teaser }}{% else %}{{ site.url }}{{ site.logo }}{% endif %}"
      },
      "url": "{{ site.url }}{{ site.baseurl }}{{ page.url }}",
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "{{ site.url }}{{ site.baseurl }}{{ page.url }}"
      },
      "articleSection": "{{ page.categories | first }}",
      "keywords": "{{ page.tags | join: ', ' }}",
      "inLanguage": "en-US"
    },
    {
      "@type": "BreadcrumbList",
      "@id": "{{ site.url }}{{ site.baseurl }}{{ page.url }}#breadcrumb",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "{{ site.url }}{{ site.baseurl }}"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "{{ page.categories | first }}",
          "item": "{{ site.url }}{{ site.baseurl }}/categories/#{{ page.categories | first | slugify }}"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "{{ page.title | escape }}",
          "item": "{{ site.url }}{{ site.baseurl }}{{ page.url }}"
        }
      ]
    }
  ]
}
</script>

<!-- Extended Article Summary Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "@id": "{{ site.url }}{{ site.baseurl }}{{ page.url }}#article-summary",
  "headline": "{{ page.title | escape }}",
  "abstract": "{% if page.summary %}{{ page.summary | escape }}{% else %}{{ page.excerpt | strip_html | strip_newlines | truncate: 200 | escape }}{% endif %}",
  "articleBody": "{{ page.content | strip_html | strip_newlines | truncate: 200 | escape }}",
  "author": {
    "@type": "Person",
    "name": "{{ site.author.name }}",
    "url": "{{ site.url }}{{ site.baseurl }}"
  },
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "publisher": {
    "@type": "Organization",
    "name": "{{ site.title }}",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ site.url }}{{ site.logo }}"
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ site.url }}{{ site.baseurl }}{{ page.url }}"
  },
  "wordCount": "{{ page.content | number_of_words }}",
  "timeRequired": "PT{% assign words = page.content | number_of_words %}{% assign minutes = words | divided_by: 200 | plus: 1 %}{{ minutes }}M",
  "inLanguage": "en-US"
}
</script>
{% elsif page.layout == "home" %}
<!-- Blog Home: Blog + CollectionPage -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Blog",
      "@id": "{{ site.url }}{{ site.baseurl }}{{ page.url }}#blog",
      "url": "{{ site.url }}{{ site.baseurl }}{{ page.url }}",
      "name": "{{ site.title }}",
      "description": "{{ site.description | strip_newlines | escape }}",
      "publisher": {
        "@id": "{{ site.url }}{{ site.baseurl }}/#organization"
      },
      "inLanguage": "en-US",
      "blogPost": [
        {% for post in site.posts limit:10 %}
        {
          "@type": "BlogPosting",
          "@id": "{{ site.url }}{{ site.baseurl }}{{ post.url }}",
          "headline": "{{ post.title | escape }}",
          "url": "{{ site.url }}{{ site.baseurl }}{{ post.url }}",
          "datePublished": "{{ post.date | date_to_xmlschema }}",
          "author": {
            "@id": "{{ site.url }}{{ site.baseurl }}/#author"
          }
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    }
  ]
}
</script>
{% elsif page.layout == "categories" or page.layout == "category" %}
<!-- Category Page: CollectionPage -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "@id": "{{ site.url }}{{ site.baseurl }}{{ page.url }}#collection",
  "url": "{{ site.url }}{{ site.baseurl }}{{ page.url }}",
  "name": "{{ page.title | default: 'Categories' }} - {{ site.title }}",
  "description": "Browse posts by category on {{ site.title }}",
  "isPartOf": {
    "@id": "{{ site.url }}{{ site.baseurl }}/#website"
  },
  "inLanguage": "en-US"
}
</script>
{% elsif page.layout == "tags" or page.layout == "tag" %}
<!-- Tag Page: CollectionPage -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "@id": "{{ site.url }}{{ site.baseurl }}{{ page.url }}#collection",
  "url": "{{ site.url }}{{ site.baseurl }}{{ page.url }}",
  "name": "{{ page.title | default: 'Tags' }} - {{ site.title }}",
  "description": "Browse posts by tag on {{ site.title }}",
  "isPartOf": {
    "@id": "{{ site.url }}{{ site.baseurl }}/#website"
  },
  "inLanguage": "en-US"
}
</script>
{% endif %}
