# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Infrastructure Intelligence
logo: "/assets/images/logo.png"
logo_url: "https://axonshield.com"
email: dan.c@axonshield.com
description: >
  Strategic insights in operational intelligence and preventing IT
  corporate amnesia in service and software enterprises (healthcare, education,
  universities,fintech). Led by Dan Cvrcek,
  exploring how systematic infrastructure management protects student success
  and institutional mission.
baseurl: "/blognew" # the subpath of your site, e.g. /blog
url: "https://axonshield.com" # the base hostname & protocol for your site

# Google Analytics
#google_analytics: G-D7Y27V4B1X

# Google Tag Manager
#google_tag_manager: GTM-NKDVLH7R

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:slug/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: America/New_York # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-remote-theme

# Feed configuration
feed:
  posts_limit: 20
  excerpt_only: false

author:
  name   : "[Dan Cvrcek](https://linkedin.com/in/dancvrcek) [Tsvrcheck]"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "I am a left-handed contrarian living by JFDI. I delivered secret and certificate services, 
  DNS automation and WAF protection for Barclays, Sky UK, TSB Bank, Deutsche Bank, or Comcast. 
  With a professorship from Czech Republic and Cambridge University post-doctoral research, 
  I combine startup agility with enterprise experience to transform clients' operations.
  I am always interested in talking with people about their challenges - no strings attached. 
  dan.c@axonshield.com"

  links:
    - label: "$15 Million Line Item<br>That Doesn't Exist<br><small>Amazon Kindle and paperback</small>"
      image: "/assets/images/posts/15-million-line-item/book-cover-3.png"
      url: "https://www.amazon.com/dp/B0FX144F9R?utm_source=blog&utm_medium=sidebar&utm_campaign=book_profile&utm_content=author_links"
    - label: "Beyond Certificate<br>Automation<br><small>Amazon Kindle and paperback</small>"
      image: "/assets/images/posts/15-million-line-item/book-cover-1.png"
      url: "https://www.amazon.com/dp/B0G3YV6MVY?utm_source=blog&utm_medium=sidebar&utm_campaign=book_profile&utm_content=author_links"
    - image: "/assets/images/logo.png"
      url: "https://axonshield.com"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
